<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sisledere Köyü - Oyun</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
</head>
<body>

  <div class="stage-frame">
    <!-- Üst Bilgi Başlıkları -->
    <div class="stage-title" id="stage-title">Yükleniyor...</div>
    <div class="stage-day-tag" id="stage-day">Gün 1</div>

    <!-- Oyun Sahnesi -->
    <div class="stage" id="stage-main">
      <!-- Hotspot'lar JS ile buraya yüklenecek -->
    </div>

    <!-- Sol Alt: Envanter -->
    <div class="inventory" id="inventory-bar">
      <div class="inv-slot" id="slot-0"></div>
      <div class="inv-slot" id="slot-1"></div>
      <div class="inv-slot" id="slot-2"></div>
      <div class="inv-slot" id="slot-3"></div>
    </div>

    <!-- Sağ Alt: Harita ve Not Defteri Butonları -->
    <div class="corner-icons">
      <button class="corner-icon-btn" id="btn-open-map" title="Harita">
        <img src="assets/images/ui/icon_map.png" alt="Harita" onerror="this.style.display='none'; this.parentNode.innerText='🗺️'">
      </button>
      <button class="corner-icon-btn" id="btn-open-notebook" title="Not Defteri">
        <img src="assets/images/ui/icon_notebook.png" alt="Defter" onerror="this.style.display='none'; this.parentNode.innerText='📓'">
      </button>
    </div>

    <!-- MODAL 1: Harita Overlay -->
    <div class="map-overlay" id="map-modal">
      <div class="map-card">
        <button class="map-overlay-close" id="btn-close-map">X</button>
        <h3 style="color: #e3a94a; margin-bottom: 10px;">Sisledere Haritası</h3>
        <div style="flex:1; background: #2a241e; border: 1px solid #443; display:flex; align-items:center; justify-content:center; color:#888;">
          [ HARİTA GÖRSELİ / LOKASYONLAR ]
        </div>
      </div>
    </div>

    <!-- MODAL 2: Not Defteri Overlay -->
    <div class="notebook-overlay" id="notebook-modal">
      <div class="notebook-card">
        <button class="notebook-overlay-close" id="btn-close-notebook">X</button>
        <h3 style="color: #e3a94a; margin-bottom: 10px;">Dedektif Defteri</h3>
        <div style="position:relative; flex:1;">
          <textarea class="nb-yazi" placeholder="Notlarınızı buraya yazabilirsiniz..."></textarea>
          <canvas class="nb-canvas-full pasif" id="nb-canvas"></canvas>
        </div>
      </div>
    </div>

  </div>

  <script src="engine.js"></script>
</body>
</html>
