<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sisledere Köyü - Giriş</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #000;
      color: #fff;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    .intro-container {
      position: relative;
      width: 100vw;
      height: 56.25vw;
      max-height: 100vh;
      max-width: 177.78vh;
      background: #050505;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .char-img {
      max-height: 60%;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .char-img.show { opacity: 1; }
    .subtitle {
      position: absolute;
      bottom: 10%;
      width: 80%;
      text-align: center;
      font-size: clamp(14px, 1.5vw, 22px);
      color: #dcd0b9;
      background: rgba(0,0,0,0.7);
      padding: 12px 20px;
      border-radius: 6px;
      border: 1px solid #443;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .subtitle.show { opacity: 1; }
  </style>
</head>
<body>

  <div class="intro-container" id="intro-box">
    <img id="char-polis" class="char-img" src="assets/images/characters/polis.png" alt="Polis">
    <div id="subtitles" class="subtitle"></div>
  </div>

  <script>
    const introData = [
      { char: 'polis', text: "Sisledere Köyü... Uzun zamandır bu kadar sessiz bir yer görmemiştim." },
      { char: 'polis', text: "Ancak bu sessizliğin altında saklanan bir şeyler var." },
      { char: 'polis', text: "Davanın detaylarını incelemek için karakola geçmeliyim." }
    ];

    let step = 0;
    const sub = document.getElementById('subtitles');
    const charPolis = document.getElementById('char-polis');

    function nextStep() {
      if (step < introData.length) {
        const item = introData[step];
        sub.innerText = item.text;
        sub.classList.add('show');
        if (item.char === 'polis') charPolis.classList.add('show');
        step++;
      } else {
        sub.classList.remove('show');
        charPolis.classList.remove('show');
        setTimeout(() => { 
          window.location.href = "oyun_2.html"; 
        }, 500);
      }
    }

    document.getElementById('intro-box').addEventListener('click', nextStep);
    // İlk adımı başlat
    nextStep();
  </script>
</body>
</html>
