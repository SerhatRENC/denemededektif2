<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sisledere">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json?v=3">
<link rel="apple-touch-icon" href="assets/icon-192.png?v=3">
<title>Sislidere Davası</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=14">
<link rel="stylesheet" href="ogretici.css?v=9">
<link rel="stylesheet" href="vfx.css">
<script src="vfx.js"></script>
<script src="sfx.js"></script>

<!-- Service Worker Kaydı -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker Aktif:', reg.scope))
        .catch(err => console.error('Service Worker Kayıt Hatası:', err));
    });
  }
</script>
</head>
<body>

  <h1 id="caseTitle">Yükleniyor...</h1>

  <div class="stage-wrap">
    <div class="stage-frame" id="stageFrame">
      <div class="stage" id="stage"></div>

      <img class="stage-day-tag" id="dayBadge" src="assets/arayuz/takvim_gun1.webp" alt="Gün 1">

      <button class="tam-ekran-btn" id="tamEkranBtn" title="Tam Ekran">⛶</button>

      <div class="corner-icons">
        <div class="corner-icon-item harita">
          <button class="corner-icon-btn" onclick="kosePop(this, openMap, 'harita')" title="Harita">
            <img src="assets/arayuz/harita.webp" alt="Harita">
          </button>
          <div class="corner-icon-label">Harita</div>
        </div>
        <div class="corner-icon-item defter">
          <button class="corner-icon-btn" onclick="kosePop(this, openNotebook, 'kitap')" title="Not Defteri">
            <img src="assets/arayuz/defter.webp" alt="Not Defteri">
          </button>
          <div class="corner-icon-label">Defter</div>
        </div>
      </div>

      <!-- HARİTA OVERLAY -->
      <div class="map-overlay" id="mapOverlay">
        <button class="map-overlay-close" onclick="closeMap()">✕</button>
        <div class="map-scroll">
          <div class="map-box">
            <img id="mapImage" src="" alt="Harita">
            <div id="mapHotspots"></div>
          </div>
        </div>
      </div>

      <!-- NOT DEFTERİ OVERLAY -->
      <div class="notebook-overlay" id="notebookOverlay">
        <button class="notebook-overlay-close" onclick="closeNotebook()">✕</button>
        <div class="notebook-scroll">
        <div class="notebook-box">
          <div class="notebook-img-wrap" id="notebookImgWrap">
            <img id="notebookImage" src="" alt="Not Defteri">
            <div class="notebook-img-fallback" id="notebookImgFallback" style="display:none;"></div>

            <div class="nb-page sol" id="nbPageSol">
              <div class="nb-suspect-row" id="nbRow0">
                <div class="nb-suspect-notes" id="nbNotesSolUst">
                  <textarea class="nb-yazi" id="nbYaziSolUst" placeholder="buraya not alabilirsin..." oninput="notebookYaziKaydet('solUst', this)"></textarea>
                </div>
                <div class="nb-suspect-overlay">
                  <img class="nb-suspect-photo" id="nbPhoto0" src="" alt="">
                  <div class="nb-suspect-name" id="nbName0"></div>
                </div>
              </div>
              <div class="nb-suspect-row" id="nbRow1">
                <div class="nb-suspect-notes" id="nbNotesSolAlt">
                  <textarea class="nb-yazi" id="nbYaziSolAlt" placeholder="buraya not alabilirsin..." oninput="notebookYaziKaydet('solAlt', this)"></textarea>
                </div>
                <div class="nb-suspect-overlay">
                  <img class="nb-suspect-photo" id="nbPhoto1" src="" alt="">
                  <div class="nb-suspect-name" id="nbName1"></div>
                </div>
              </div>
            </div>

            <div class="nb-page sag" id="nbPageSag">
              <textarea class="nb-yazi" id="nbYaziSag" oninput="notebookYaziKaydet('sag', this)" placeholder="buraya not al..."></textarea>
            </div>

            <canvas class="nb-canvas-full pasif" id="nbCanvasFull"></canvas>

            <button class="nb-edge-arrow nb-edge-left" id="nbEdgeGeri" onclick="notebookSayfaGeri()">‹</button>
            <button class="nb-edge-arrow nb-edge-right" id="nbEdgeIleri" onclick="notebookSayfaIleri()">›</button>
          </div>
          <div class="notebook-toolbar">
            <button class="nb-btn active" id="nbModYaz" onclick="notebookModAyarla('yaz')">✎ Yaz</button>
            <button class="nb-btn" id="nbModCiz" onclick="notebookModAyarla('ciz')">✏️ Çiz</button>
            <button class="nb-btn" id="nbModSil" onclick="notebookModAyarla('sil')">🧽 Sil</button>
            <div class="nb-renkler">
              <button class="nb-renk-btn aktif" id="nbRenkSiyah" style="background:#1a1a1a" onclick="notebookRenkSec('#1a1a1a')" title="Siyah"></button>
              <button class="nb-renk-btn" id="nbRenkKirmizi" style="background:#8f2a1e" onclick="notebookRenkSec('#8f2a1e')" title="Kırmızı"></button>
            </div>
            <span class="nb-sayfa-gösterge" id="nbSayfaGöstergesi">Sayfa 1 / 5</span>
          </div>
        </div>
        </div>
      </div>

      <!-- SUÇLAMA / OYUN SONU KATMANI -->
      <div class="suclama-overlay" id="suclamaOverlay"></div>

      <!-- MODAL -->
      <div class="modal-bg" id="modalBg">
        <div class="modal" id="modalBody"></div>
      </div>

      <div class="inventory" id="inventory"><span class="inv-empty">envanter boş</span></div>
    </div>
  </div>

  <div class="donme-uyarisi">
    <div class="ikon">📱</div>
    <p>Daha iyi bir deneyim için lütfen telefonunuzu yatay çevirin.</p>
  </div>

  <button class="calib-toggle" id="calibToggle">🎯 Kalibrasyon Modu: Kapalı</button>
  <div class="calib-readout" id="calibReadout"></div>

  <div class="sleep-overlay" id="sleepOverlay">
    <div class="content">
      <div class="day-num" id="sleepDayNum">GÜN 2</div>
      <p id="sleepText">Yeni bir gün başlıyor.</p>
      <button onclick="wakeUp()">Uyan</button>
    </div>
  </div>

  <script src="engine.js?v=15"></script>
  <script src="ogretici.js?v=3"></script>
  <script src="yukleme.js?v=1"></script>
  <script>
    function hizalaSorguOklari() {
      const img = document.getElementById('statementZoomImg');
      const modal = document.getElementById('modalBody');
      if (!img || !modal) return;
      const sol = modal.querySelector('.reader-side-arrow.left');
      const sag = modal.querySelector('.reader-side-arrow.right');
      const imgRect = img.getBoundingClientRect();
      const modalRect = modal.getBoundingClientRect();
      if (sol) sol.style.left = Math.max(8, imgRect.left - modalRect.left - sol.offsetWidth * 0.5) + 'px';
      if (sag) sag.style.right = Math.max(8, modalRect.right - imgRect.right - sag.offsetWidth * 0.5) + 'px';
    }
    window.addEventListener('resize', hizalaSorguOklari);
    const _openStatementOrijinal = openStatement;
    openStatement = function (index) {
      _openStatementOrijinal(index);
      const img = document.getElementById('statementZoomImg');
      if (img) { if (img.complete) requestAnimationFrame(hizalaSorguOklari); else img.onload = hizalaSorguOklari; }
    };

    const IKON_BEKLEME_MS = 1000;
    const ARKA_PLAN_YUKLEME = true;
    const YURUME_SESI = 'assets/ses/yuru.mp3';

    if (typeof Yukleme !== 'undefined') {
      Yukleme.kur({ sahne: document.getElementById('stageFrame'), ses: YURUME_SESI, metin: '(Mekana yürünüyor...)' });
    }

    function kosePop(btn, ac, ses) {
      if (ses && typeof calSes === 'function') calSes(ses);
      btn.classList.add('tiklandi');
      setTimeout(() => btn.classList.remove('tiklandi'), 260);
      setTimeout(ac, 90);
    }

    const _updateDayBadgeOrijinal = updateDayBadge;
    updateDayBadge = function () {
      const rozet = document.getElementById('dayBadge');
      rozet.src = 'assets/arayuz/takvim_gun' + currentDay + '.webp';
      rozet.alt = 'Gün ' + currentDay;
    };
    document.getElementById('dayBadge').addEventListener('error', function () {
      this.classList.add('yuklenemedi');
    });
    document.getElementById('dayBadge').addEventListener('load', function () {
      this.classList.remove('yuklenemedi');
    });

    const _handleHotspotOrijinal = handleHotspot;
    handleHotspot = function (h) {
      // Gazeteci kapısındaki tokmak (Kapıyı Aç) tıklandığında
      if (h.type === 'kapida_konus') {
        // 1. Özel kilit sesini çal
        const kilitAudio = new Audio('assets/ses/kilit.mp3');
        kilitAudio.play().catch(() => {});

        // 2. Karakter görselini sağda oluştur
        let charImg = document.getElementById('tempKapiChar');
        if (!charImg) {
          charImg = document.createElement('img');
          charImg.id = 'tempKapiChar';
          charImg.style.position = 'absolute';
          charImg.style.right = '5%';
          charImg.style.bottom = '-15%';
          charImg.style.height = '85%';
          charImg.style.zIndex = '100';
          charImg.style.cursor = 'pointer';
          document.getElementById('stageFrame').appendChild(charImg);
        }
        charImg.src = h.characterImage || 'assets/karakterler/riza.webp';
        charImg.style.display = 'block';

        // 3. Özel Diyalog Kutusu Oluştur
        let subBox = document.getElementById('kapiSubtitleBox');
        if (!subBox) {
          subBox = document.createElement('div');
          subBox.id = 'kapiSubtitleBox';
          subBox.style.position = 'absolute';
          subBox.style.left = '5%';
          subBox.style.right = '32%';
          subBox.style.bottom = '6%';
          subBox.style.background = 'rgba(20, 14, 8, 0.95)';
          subBox.style.color = '#e9dcc0';
          subBox.style.padding = '1.2em 1.5em';
          subBox.style.borderRadius = '8px';
          subBox.style.borderLeft = '5px solid #8a5a2b';
          subBox.style.fontSize = 'clamp(16px, 1.9cqw, 22px)';
          subBox.style.zIndex = '101';
          subBox.style.boxShadow = '0 4px 15px rgba(0,0,0,0.8)';
          subBox.style.cursor = 'pointer';
          document.getElementById('stageFrame').appendChild(subBox);
        }

        let dIndex = 0;
        const dialogList = h.dialog || [];

        function adimAt(e) {
          if (e) e.stopPropagation();
          if (dIndex < dialogList.length) {
            const item = dialogList[dIndex];
            subBox.innerHTML = `<strong>${item.speaker}:</strong> ${item.text}`;
            subBox.style.display = 'block';
            dIndex++;
          } else {
            // Sohbet bitince elemanları kaldır
            if (subBox) subBox.remove();
            if (charImg) charImg.remove();
            document.getElementById('stageFrame').removeEventListener('click', adimAt);
          }
        }

        adimAt();

        setTimeout(() => {
          document.getElementById('stageFrame').addEventListener('click', adimAt);
        }, 100);

        return;
      }

      if (h.icon && typeof calSes === 'function') {
        if (h.icon.endsWith('tokmak.webp')) calSes('kapi');
        else if (h.icon.endsWith('geri.webp')) calSes('geri');
        else if (h.icon.endsWith('ayak.webp') && h.label === 'Git') calSes('kapi_git');
        else if (h.icon.endsWith('buyutec.webp')) calSes('incele');
      }
      if (h.type === 'dosya' && typeof calSes === 'function') calSes('harita');
      _handleHotspotOrijinal(h);
    };

    document.getElementById('mapHotspots').addEventListener('click', (e) => {
      if (e.target.closest('.map-hotspot') && typeof calSes === 'function') calSes('kapi');
    });

    document.getElementById('modalBg').addEventListener('click', (e) => {
      if (e.target.closest('.reader-side-arrow') && typeof calSes === 'function') calSes('sayfa');
    });

    const _wakeUpOrijinal = wakeUp;
    wakeUp = function () {
      const parlak = document.createElement('div');
      parlak.className = 'sabah-parlama';
      document.getElementById('stageFrame').appendChild(parlak);
      requestAnimationFrame(() => parlak.classList.add('aktif'));
      _wakeUpOrijinal();
      setTimeout(() => parlak.remove(), 1300);
    };

    const _renderRoomOrijinal = renderRoom;
    let _odaJetonu = 0;
    let _arkaPlanBasladi = false;

    function _odaCiz() {
      _renderRoomOrijinal();
      if (typeof Ogretici !== 'undefined') {
        Ogretici.kur({
          sahne: document.getElementById('stageFrame'),
          icerik: (CASE && CASE.ogretici) || {},
          onek: (CASE && CASE.caseLabel) || 'oyun',
          mevcut: () => currentRoom
        });
        Ogretici.iptal();
        Ogretici.goster(currentRoom);
      }

      setTimeout(() => {
        document.querySelectorAll('#stage .ikon-bekliyor').forEach(el => el.classList.remove('ikon-bekliyor'));
      }, 180 + IKON_BEKLEME_MS);

      setTimeout(() => {
        document.querySelectorAll('#stage img[alt="Geri dön"]').forEach(img => {
          const kap = img.parentElement;
          kap.style.width = '7.5%';
          if (!kap.querySelector('.hotspot-pulse-label')) {
            const et = document.createElement('div');
            et.className = 'hotspot-pulse-label';
            et.textContent = 'Geri';
            kap.appendChild(et);
          }
        });
      }, 220);

      if (typeof VFX !== 'undefined') VFX.load(currentRoom, document.getElementById('stageFrame') || document.getElementById('stage'));
      if (typeof SFX !== 'undefined') SFX.play(currentRoom);

      if (ARKA_PLAN_YUKLEME && !_arkaPlanBasladi && typeof Yukleme !== 'undefined') {
        _arkaPlanBasladi = true;
        Yukleme.arkaPlanda(_arkaPlanListesi());
      }
    }

    function _arkaPlanListesi() {
      const liste = [];
      if (!CASE || !CASE.rooms) return liste;
      const ekle = u => { if (u && !liste.includes(u)) liste.push(u); };
      const oncelik = ['masa', 'merkez'];
      const sirali = oncelik.concat(Object.keys(CASE.rooms).filter(k => !oncelik.includes(k)));
      sirali.forEach(k => {
        const oda = CASE.rooms[k];
        if (!oda) return;
        ekle(oda.background);
        if (oda.closedOnDays && oda.closedOnDays.includes(currentDay)) ekle(oda.closedImage);
        if (CASE.characters && CASE.characters[k]) ekle(CASE.characters[k].image);
      });
      ekle(CASE.map && CASE.map.image);
      ekle(CASE.notebook && CASE.notebook.image);
      return liste;
    }

    renderRoom = function () {
      const jeton = ++_odaJetonu;
      if (!CASE || !CASE.rooms || !CASE.rooms[currentRoom]) {
        _odaCiz();
        return;
      }
      const oda = CASE.rooms[currentRoom];
      const kapali = oda.closedOnDays && oda.closedOnDays.includes(currentDay);
      const karakter = (!kapali && CASE.characters && CASE.characters[currentRoom]) ? CASE.characters[currentRoom].image : null;
      
      if (typeof Yukleme !== 'undefined' && Yukleme.gecis) {
        Yukleme.gecis([kapali ? oda.closedImage : oda.background, karakter], () => {
          if (jeton !== _odaJetonu) return;
          _odaCiz();
        });
      } else {
        _odaCiz();
      }
    };

    if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches || !document.fullscreenEnabled) {
      document.getElementById('tamEkranBtn').style.display = 'none';
    }
    document.getElementById('tamEkranBtn').addEventListener('click', () => {
      const el = document.documentElement;
      if (!document.fullscreenElement) {
        const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
        if (req) req.call(el).catch(() => {});
      } else {
        const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
        if (exit) exit.call(document).catch(() => {});
      }
    });
  </script>
</body>
</html>
