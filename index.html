<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="manifest.json?v=2">
<link rel="apple-touch-icon" href="assets/arayuz/icon-192.png?v=2">
<title>Sislidere Köyü Davası</title>
<link rel="stylesheet" href="ogretici.css?v=9">
<link rel="stylesheet" href="vfx.css">
<script src="vfx.js"></script>
<script src="sfx.js"></script>
</head>
<body>
<div class="donme-uyarisi">
  <div class="ikon">📱</div>
  <p>Daha iyi bir deneyim için lütfen telefonunuzu yatay çevirin.</p>
</div>

<div id="stage-frame">

  <button class="tam-ekran-btn" id="tamEkranBtn" title="Tam Ekran">⛶</button>

  <!-- 1. ANA EKRAN -->
  <div class="screen active" id="scr-ana" style="background-image:url('assets/odalar/giris.webp')">
    <div class="hotspot" id="btn-oyna" style="left:3.0%;top:30.8%;width:19%;height:9%;"></div>
    <div class="hotspot" id="btn-hakkinda" style="left:3.4%;top:43.5%;width:19%;height:9%;"></div>
    <div class="hotspot" id="btn-nasil" style="left:3.4%;top:57.2%;width:19%;height:9%;"></div>
  </div>

  <!-- 2. OFİS / ŞEHİR -->
  <div class="screen" id="scr-ofis" style="background-image:url('assets/odalar/ofis_sehir.webp')">
    <div class="nabiz-ikon-wrap gec-bekle gizli" id="btn-telgraf" style="left:14.6%;top:71.5%;width:8%;">
      <img src="assets/arayuz/el.webp" alt="Telgrafa Bas">
      <div class="nabiz-ikon-etiket">Bak</div>
    </div>
    <div class="nabiz-ikon-wrap gizli" id="btn-ofis-incele" style="left:50%;top:72%;width:8%;">
      <img src="assets/arayuz/buyutec.webp" alt="İncele">
      <div class="nabiz-ikon-etiket">İncele</div>
    </div>
    <div class="nabiz-ikon-wrap gizli" id="btn-kapi-ayak" style="left:34.3%;top:47.1%;width:6%;">
      <img src="assets/arayuz/ayak.webp" alt="Git">
      <div class="nabiz-ikon-etiket">Git</div>
    </div>
  </div>

  <!-- 3. MORS KAĞIDI -->
  <div class="screen" id="scr-mors" style="background-image:url('assets/odalar/mors_kagidi.webp')">
    <div class="nabiz-ikon-wrap gec-bekle gizli" id="btn-mors-tekrar" style="left:17.7%;top:59.2%;width:8%;">
      <img src="assets/arayuz/kulak.webp" alt="Mesajı Dinle">
      <div class="nabiz-ikon-etiket">Dinle</div>
    </div>

    <div class="mors-yazi-alani">
      <input type="text" id="mors-input" placeholder="..." maxlength="30" autocomplete="off">
    </div>
    <button class="btn show" id="btn-mors-ilerle" style="left:82.0%;top:76.0%;">İlerle</button>
  </div>

  <!-- 4. RAF -->
  <div class="screen" id="scr-raf" style="background-image:url('assets/odalar/raf.webp')">
    <div class="nabiz-ikon-wrap gec-bekle gizli" id="btn-dosya-incele" style="left:64.4%;top:47.4%;width:8%;">
      <img src="assets/arayuz/el.webp" alt="İncele">
      <div class="nabiz-ikon-etiket">Bak</div>
    </div>
  </div>

  <!-- 5. SİSLİDERE DOSYASI -->
  <div class="screen" id="scr-dosya" style="background-image:url('assets/odalar/sislidere_dosya.webp')">
    <div class="nabiz-ikon-wrap gec-bekle gizli" id="btn-dosya-incele-ic" style="left:55%;top:45%;width:8%;">
      <img src="assets/arayuz/buyutec.webp" alt="İncele">
      <div class="nabiz-ikon-etiket">İncele</div>
    </div>
    <div class="nabiz-ikon-wrap gizli" id="btn-dosya-geri" style="left:9%;top:57.5%;width:7.5%;">
      <img src="assets/arayuz/geri.webp" alt="Geri">
      <div class="nabiz-ikon-etiket">Geri</div>
    </div>
  </div>

  <!-- 6. AT ARABASI -->
  <div class="screen" id="scr-araba" style="background-image:url('assets/odalar/at_arabasi.webp')">
    <div class="nabiz-ikon-wrap gec-bekle gizli" id="btn-bin" style="left:69.2%;top:67.7%;width:5%;">
      <img src="assets/arayuz/ayak.webp" alt="Bin">
      <div class="nabiz-ikon-etiket">Git</div>
    </div>
  </div>

  <!-- 7. KÖY GİRİŞİ -->
  <div class="screen" id="scr-koy" style="background-image:url('assets/odalar/koy_giris.webp')">
    <img class="character" id="char-halit" src="assets/karakterler/halit.webp" alt="Halit">
    <div class="subtitle" id="sub-halit"></div>
    <div class="nabiz-ikon-wrap gizli" id="btn-ofise-git" style="left:49.5%;top:62.8%;width:5%;">
      <img src="assets/arayuz/ayak.webp" alt="Ofise Git">
      <div class="nabiz-ikon-etiket">Git</div>
    </div>
  </div>

  <!-- 8. DEDEKTİF OFİSİ -->
  <div class="screen" id="scr-dedektif" style="background-image:url('assets/odalar/dedektif_ofis.webp')">
    <img class="character" id="char-polis" src="assets/karakterler/polis.webp" alt="Polis">
    <div class="subtitle" id="sub-polis"></div>
  </div>

  <div id="popup-overlay">
    <button id="popup-close">×</button>
    <div class="zoom-wrap">
      <img id="popupImg" src="assets/arayuz/ali_ihsan.webp" alt="Ali İhsan">
    </div>
  </div>

  <audio id="aud-mesaj" src="assets/ses/mesaj.mp3" preload="auto"></audio>
  <audio id="aud-mors" src="assets/ses/mors_kodu.mp3" preload="auto"></audio>

</div>
</body>
</html>
