<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sislidere Davası - Giriş</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0d0d0d;
      color: #fff;
      font-family: 'Georgia', serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Oyun Sahnesi (16:9 Oranında Sabit Kapsayıcı) */
    #gameStage {
      position: relative;
      width: 100vw;
      max-width: 177.78vh; /* 16:9 Oranı korur */
      height: 56.25vw;
      max-height: 100vh;
      background-image: url('assets/odalar/scr_ofis.webp');
      background-size: cover;
      background-position: center;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
      overflow: hidden;
    }

    /* Ateş & Toz Efekti Canvas Katmanı */
    #particlesCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    /* Tıklanabilir Alanlar Katmanı */
    .hotspot-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
    }

    /* Genel Tıklanabilir Buton/Alan Stili */
    .click-area {
      position: absolute;
      cursor: pointer;
      border: 1px dashed rgba(255, 255, 255, 0.0); /* Test ederken görmek için 0.3 yapabilirsin */
      transition: background 0.2s ease, border-color 0.2s ease;
      border-radius: 4px;
    }

    .click-area:hover {
      background: rgba(230, 126, 34, 0.15);
      border-color: rgba(230, 126, 34, 0.5);
    }

    /* Modal / Bilgi Pencereleri */
    .modal-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-box {
      background: #1a1815;
      border: 1px solid #7a6348;
      padding: 30px;
      max-width: 500px;
      width: 90%;
      color: #dcd3c0;
      border-radius: 6px;
      box-shadow: 0 0 30px #000;
      text-align: center;
    }

    .modal-box h2 {
      margin-bottom: 15px;
      color: #e67e22;
    }

    .modal-box p {
      line-height: 1.6;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .close-btn {
      background: #7a6348;
      color: #fff;
      border: none;
      padding: 8px 20px;
      cursor: pointer;
      font-family: inherit;
      border-radius: 4px;
    }

    .close-btn:hover {
      background: #a38460;
    }
  </style>
</head>
<body>

  <div id="gameStage">
    <!-- Ateş Parçacıkları Katmanı -->
    <canvas id="particlesCanvas"></canvas>

    <!-- Hotspot Tıklama Katmanı -->
    <div class="hotspot-layer" id="hotspotLayer">
      <!-- Oyna Butonu -->
      <div class="click-area" style="left: 8.5%; top: 26.6%; width: 16.0%; height: 12.1%;" onclick="oyunaBasla()" title="Oyna"></div>
      
      <!-- Hakkında Butonu -->
      <div class="click-area" style="left: 8.5%; top: 41.5%; width: 16.2%; height: 11.6%;" onclick="modalAc('hakkinda')" title="Hakkında"></div>
      
      <!-- Nasıl Oynanır Butonu -->
      <div class="click-area" style="left: 8.5%; top: 56.7%; width: 16.0%; height: 12.3%;" onclick="modalAc('nasilOynanir')" title="Nasıl Oynanır"></div>
      
      <!-- Polis Memuru -->
      <div class="click-area" style="left: 48.7%; top: 27.8%; width: 16.5%; height: 39.6%;" onclick="polisKonus()" title="Polis Memuru"></div>
    </div>

    <!-- Modallar -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-box">
        <h2 id="modalTitle">Başlık</h2>
        <p id="modalContent">İçerik</p>
        <button class="close-btn" onclick="modalKapat()">Kapat</button>
      </div>
    </div>
  </div>

  <script>
    // 1. OYUNA BAŞLAMA
    function oyunaBasla() {
      window.location.href = 'oyun.html';
    }

    // 2. POLİS İLE KONUŞMA
    function polisKonus() {
      alert("Polis Memuru: 'Dedektif Bey, evraklar masada hazır. Sislidere'deki olayı çözmek için yola çıkabilirsiniz.'");
    }

    // 3. MODAL YÖNETİMİ
    function modalAc(tip) {
      const overlay = document.getElementById('modalOverlay');
      const title = document.getElementById('modalTitle');
      const content = document.getElementById('modalContent');

      if (tip === 'hakkinda') {
        title.textContent = "Hakkında";
        content.textContent = "Sislidere Davası, 1980'lerde karanlık bir dağ köyünde geçen interaktif dedektiflik oyunudur. İpuçlarını toplayın, ifadeleri inceleyin ve katili bulun.";
      } else if (tip === 'nasilOynanir') {
        title.textContent = "Nasıl Oynanır";
        content.textContent = "Sahnelerdeki nesnelere ve karakterlere tıklayarak bilgi toplayın. Not defterinize önemli detayları yazın. Her günün sonunda uyuyarak bir sonraki güne geçebilirsiniz.";
      }
      overlay.classList.add('active');
    }

    function modalKapat() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // 4. ATEŞ KÖZÜ VE TOZ EFEKTİ (CANVAS)
    (function initParticles() {
      const canvas = document.getElementById('particlesCanvas');
      const ctx = canvas.getContext('2d');

      function resize() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      window.addEventListener('resize', resize);
      resize();

      const particles = [];
      const particleCount = 40;

      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: Math.random() * 2.5 + 0.5,
          speedX: (Math.random() - 0.5) * 0.4,
          speedY: -(Math.random() * 0.8 + 0.2),
          opacity: Math.random() * 0.8 + 0.2,
          color: Math.random() > 0.4 ? '#e67e22' : '#f1c40f' // Ateş turuncusu ve sarı tozlar
        });
      }

      function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        particles.forEach(p => {
          p.x += p.speedX;
          p.y += p.speedY;
          p.opacity -= 0.002;

          if (p.y < 0 || p.opacity <= 0) {
            p.y = canvas.height + 10;
            p.x = Math.random() * canvas.width;
            p.opacity = Math.random() * 0.8 + 0.2;
          }

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = p.color;
          ctx.globalAlpha = p.opacity;
          ctx.shadowBlur = 6;
          ctx.shadowColor = p.color;
          ctx.fill();
        });

        requestAnimationFrame(animate);
      }

      animate();
    })();
  </script>
</body>
</html>
