<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sislidere Davası — Giriş</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=14">
  <link rel="stylesheet" href="vfx.css">
  <script src="vfx.js"></script>
  <style>
    /* Giriş ekranına özel tam oturan piksel/yüzde stil tanımları */
    .giris-menu-btn {
      position: absolute;
      background: rgba(0, 0, 0, 0.01);
      border: none;
      cursor: pointer;
      z-index: 10;
      border-radius: 4px;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }
    .giris-menu-btn:hover {
      background: rgba(255, 200, 100, 0.15);
      box-shadow: 0 0 12px rgba(255, 200, 100, 0.3);
    }
    .giris-menu-btn:active {
      transform: scale(0.96);
    }
    
    /* Aldığın koordinatların doğrudan buton sınıflarına tanımlanması */
    .btn-oyna {
      left: 8.5%;
      top: 26.6%;
      width: 16.0%;
      height: 12.1%;
    }
    .btn-hakkinda {
      left: 8.5%;
      top: 41.5%;
      width: 16.2%;
      height: 11.6%;
    }
    .btn-nasil-oynanir {
      left: 8.5%;
      top: 56.7%;
      width: 16.0%;
      height: 12.3%;
    }
  </style>
</head>
<body class="scr-ofis-body">

  <div class="stage-wrap">
    <div class="stage-frame" id="stageFrame">
      <div class="stage" id="stage"></div>

      <!-- Giriş Sayfası Tıklanabilir Butonlar -->
      <button class="giris-menu-btn btn-oyna" id="btnOyna" title="Oyuna Başla" onclick="oyunaBasla()"></button>
      <button class="giris-menu-btn btn-hakkinda" id="btnHakkinda" title="Hakkında" onclick="hakkindaAc()"></button>
      <button class="giris-menu-btn btn-nasil-oynanir" id="btnNasilOynanir" title="Nasıl Oynanır" onclick="nasilOynanirAc()"></button>

      <!-- MODAL -->
      <div class="modal-bg" id="modalBg">
        <div class="modal" id="modalBody"></div>
      </div>
    </div>
  </div>

  <div class="donme-uyarisi">
    <div class="ikon">📱</div>
    <p>Daha iyi bir deneyim için lütfen telefonunuzu yatay çevirin.</p>
  </div>

  <script src="engine.js?v=15"></script>
  <script>
    function oyunaBasla() {
      if (typeof calSes === 'function') calSes('kapi');
      window.location.href = 'oyun.html';
    }

    function hakkindaAc() {
      if (typeof calSes === 'function') calSes('incele');
      showModal(`
        <h3>Sislidere Davası Hakkında</h3>
        <p style="margin-top:12px; line-height:1.6;">
          Sislidere Köyü'nde işlenen gizemli cinayeti çözmekle görevlendirildin. 
          Şüphelileri sorgula, delilleri topla ve 7 gün içerisinde katilin kim olduğunu açığa çıkar.
        </p>
        <button class="ghost" onclick="closeModal()" style="margin-top:16px;">Kapat</button>
      `);
    }

    function nasilOynanirAc() {
      if (typeof calSes === 'function') calSes('incele');
      showModal(`
        <h3>Nasıl Oynanır?</h3>
        <ul style="text-align:left; margin-top:12px; padding-left:20px; line-height:1.8;">
          <li>Mekanlar arasında geçiş yapmak için kapı ve yol simgelerine tıkla.</li>
          <li>Şüphelilerle konuşmak için üzerlerine tıkla.</li>
          <li>Not defterini kullanarak önemli bilgileri kaydet ve çizim yap.</li>
          <li>Günü bitirmek için ofisindeki uyku butonunu kullan.</li>
        </ul>
        <button class="ghost" onclick="closeModal()" style="margin-top:16px;">Kapat</button>
      `);
    }

    // Sahne ilk açıldığında giriş odasını yükle
    window.addEventListener('load', () => {
      currentRoom = 'scr-ofis';
      if (typeof renderRoom === 'function') {
        renderRoom();
      }
    });
  </script>
</body>
</html>
