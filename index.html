<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sislidere Davası — Giriş</title>
<style>
  :root{
    --parchment:#e9dcc0;
    --parchment-dark:#3a2c1a;
    --ink:#241a0f;
    --accent:#8a5a2b;
    --error:#7a1f1f;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;height:100%;background:#0a0806;
    font-family:'Georgia','Times New Roman',serif;
    overflow:hidden;
  }

  /* ---- Sahne çerçevesi: Game 1 ile aynı formül, 16:9 kutuya oto sığdırma ---- */
  #stage-frame{
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    width:min(96vw,1600px,calc((100dvh - 40px) * 16 / 9));
    aspect-ratio:16/9;
    background:#000;
    overflow:hidden;
    box-shadow:0 0 60px rgba(0,0,0,.8);
  }

  .screen{
    position:absolute;inset:0;
    background-size:cover;background-position:center;
    opacity:0;pointer-events:none;
    transition:opacity 1s ease;
  }
  .screen.active{opacity:1;pointer-events:auto;}

  /* ---- Hotspot: görselin üstüne binen görünmez/az görünür tıklama alanı ---- */
  .hotspot{
    position:absolute;cursor:pointer;
    background:rgba(255,255,255,0);
    /* Kalibrasyon sırasında görmek için üstteki debug tuşuyla aç/kapat */
  }
  body.calibrate .hotspot{
    background:rgba(255,0,0,.25);
    outline:1px dashed #ff0;
  }

  /* ---- Ahşap/parşömen temalı fonksiyonel butonlar (görselde olmayanlar için) ---- */
  .btn{
    position:absolute;
    padding:.7em 1.6em;
    background:linear-gradient(180deg,#6b4423,#4a2f18);
    color:var(--parchment);
    border:2px solid #2c1c0e;
    border-radius:4px;
    font-family:inherit;font-size:clamp(12px,1.6vw,18px);
    letter-spacing:.03em;
    cursor:pointer;
    box-shadow:0 3px 0 #1c110a, 0 6px 10px rgba(0,0,0,.5);
    transition:transform .15s ease, box-shadow .15s ease, opacity .6s ease;
    opacity:0;pointer-events:none;
    transform:translateY(0);
  }
  .btn.show{opacity:1;pointer-events:auto;}
  .btn:hover{transform:translateY(-2px);box-shadow:0 5px 0 #1c110a,0 10px 14px rgba(0,0,0,.55);}
  .btn:active{transform:translateY(1px);box-shadow:0 2px 0 #1c110a;}

  /* ---- Alt yazı / diyalog kutusu ---- */
  .subtitle{
    position:absolute;left:6%;right:32%;bottom:6%;
    background:rgba(20,14,8,.82);
    color:var(--parchment);
    padding:1em 1.3em;
    border-radius:6px;
    border-left:4px solid var(--accent);
    font-size:clamp(12px,1.5vw,17px);
    line-height:1.4;
    opacity:0;pointer-events:none;
    transition:opacity .4s ease;
  }
  .subtitle.show{opacity:1;}

  /* ---- Karakter görseli (sağda) ---- */
  .character{
    position:absolute;right:2%;bottom:0;height:88%;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,.6));
    cursor:pointer;
    opacity:0;transition:opacity .5s ease;
    pointer-events:none;
  }
  .character.show{opacity:1;pointer-events:auto;}

  /* ---- Mors ekranı: metin girişi ---- */
  .mors-panel{
    position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
    display:flex;gap:.6em;align-items:center;
    background:rgba(20,14,8,.75);
    padding:.8em 1em;border-radius:8px;
    opacity:0;pointer-events:none;transition:opacity .6s ease;
  }
  .mors-panel.show{opacity:1;pointer-events:auto;}
  .mors-panel input{
    font-family:inherit;font-size:clamp(12px,1.5vw,16px);
    padding:.5em .7em;border-radius:4px;border:2px solid #2c1c0e;
    background:var(--parchment);color:var(--ink);
    width:clamp(140px,22vw,260px);
    text-transform:uppercase;
  }
  .mors-error{
    position:absolute;left:50%;bottom:16%;transform:translateX(-50%);
    background:rgba(122,31,31,.92);color:#fff;
    padding:.5em 1em;border-radius:6px;
    font-size:clamp(11px,1.3vw,15px);
    opacity:0;transition:opacity .3s ease;
    pointer-events:none;
  }
  .mors-error.show{opacity:1;}

  /* ---- Popup (ali_ihsan.png için) ---- */
  #popup-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,.75);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .35s ease;
    z-index:50;
  }
  #popup-overlay.show{opacity:1;pointer-events:auto;}
  #popup-overlay img{
    max-width:70%;max-height:80%;
    border:6px solid var(--parchment);
    box-shadow:0 10px 40px rgba(0,0,0,.7);
  }
  #popup-close{
    position:absolute;top:8%;right:12%;
    width:2.2em;height:2.2em;border-radius:50%;
    background:var(--parchment-dark);color:var(--parchment);
    border:2px solid var(--parchment);
    font-size:18px;cursor:pointer;line-height:1;
  }

  /* ---- Kararma / geçiş metni katmanı (at arabası sahnesi) ---- */
  #fade-layer{
    position:absolute;inset:0;background:#000;
    opacity:0;pointer-events:none;transition:opacity 1.5s ease;
    display:flex;align-items:center;justify-content:center;
    z-index:60;
  }
  #fade-layer.show{opacity:1;pointer-events:auto;}
  #fade-text{
    color:var(--parchment);font-style:italic;
    font-size:clamp(16px,2.4vw,28px);
    opacity:0;transition:opacity .8s ease;
    letter-spacing:.04em;
  }
  #fade-text.show{opacity:1;}

  /* ---- "Hakkında" modali ---- */
  #about-overlay{
    position:absolute;inset:0;background:rgba(0,0,0,.7);
    display:flex;align-items:center;justify-content:center;
    opacity:0;pointer-events:none;transition:opacity .3s ease;
    z-index:50;
  }
  #about-overlay.show{opacity:1;pointer-events:auto;}
  #about-box{
    background:var(--parchment);color:var(--ink);
    padding:2em;border-radius:8px;max-width:60%;
    font-size:clamp(12px,1.5vw,16px);line-height:1.6;
    position:relative;
  }
  #about-close{
    position:absolute;top:.6em;right:.8em;
    background:none;border:none;font-size:20px;cursor:pointer;
  }
</style>
</head>
<body>

<div id="stage-frame">

  <!-- 1) ANA EKRAN -->
  <div class="screen active" id="scr-ana" style="background-image:url('assets/giris/Ana_ekran.jpg')">
    <!-- Butonlar görselin içine zaten çizilmiş (tahta tabela), sadece tıklama alanı gerekiyor.
         Yüzdelik koordinatlar tahminidir -> kalibrasyon gerekir (aşağıdaki NOT'a bak). -->
    <div class="hotspot" data-action="oyna" style="left:4%;top:33%;width:19%;height:9%;"></div>
    <div class="hotspot" data-action="hakkinda" style="left:4%;top:43%;width:19%;height:9%;"></div>
    <div class="hotspot" data-action="cikis" style="left:4%;top:53%;width:19%;height:9%;"></div>
  </div>

  <!-- 2) OFİS / ŞEHİR -->
  <div class="screen" id="scr-ofis" style="background-image:url('assets/giris/Ofis_sehir.jpg')">
    <button class="btn" id="btn-mesaj-dinle" style="left:38%;top:78%;">Mesajı Dinle</button>
  </div>

  <!-- 3) MORS KAĞIDI -->
  <div class="screen" id="scr-mors" style="background-image:url('assets/giris/Mors_kagidi.jpg')">
    <div class="mors-panel show" id="mors-panel">
      <input type="text" id="mors-input" placeholder="Duyduğunuz mesajı yazın" maxlength="30">
      <button class="btn show" id="btn-mors-ilerle" style="position:static;">İlerle</button>
      <button class="btn show" id="btn-mors-tekrar" style="position:static;">Mesajı Tekrar Dinle</button>
    </div>
    <div class="mors-error" id="mors-error">Mesajı yanlış girdiniz.</div>
  </div>

  <!-- 4) RAF -->
  <div class="screen" id="scr-raf" style="background-image:url('assets/giris/raf.jpg')">
    <button class="btn show" id="btn-dosya-incele" style="left:40%;top:80%;">Dosyayı İncele</button>
  </div>

  <!-- 5) SİSLİDERE DOSYASI -->
  <div class="screen" id="scr-dosya" style="background-image:url('assets/giris/sislidere_dosya.jpg')">
    <button class="btn show" id="btn-incele" style="left:40%;top:85%;">İncele</button>
    <button class="btn" id="btn-git" style="left:40%;top:85%;">Git</button>
  </div>

  <!-- 6) AT ARABASI -->
  <div class="screen" id="scr-araba" style="background-image:url('assets/giris/at_arabasi.jpg')">
    <button class="btn show" id="btn-bin" style="left:42%;top:85%;">Bin</button>
  </div>

  <!-- 7) KÖY GİRİŞİ -->
  <div class="screen" id="scr-koy" style="background-image:url('assets/giris/koy_giris.jpg')">
    <img class="character" id="char-halit" src="assets/karakterler/halit.png" alt="Halit">
    <div class="subtitle" id="sub-halit"></div>
    <button class="btn" id="btn-ofise-git" style="left:40%;top:85%;">Ofise Git</button>
  </div>

  <!-- 8) DEDEKTİF OFİSİ -->
  <div class="screen" id="scr-dedektif" style="background-image:url('assets/giris/dedektif_ofis.jpg')">
    <img class="character" id="char-polis" src="assets/karakterler/polis.png" alt="Polis">
    <div class="subtitle" id="sub-polis"></div>
    <button class="btn" id="btn-sorusturma" style="left:36%;top:85%;">Soruşturmayı Başlat</button>
  </div>

  <!-- ORTAK KATMANLAR -->
  <div id="popup-overlay">
    <button id="popup-close">×</button>
    <img src="assets/giris/ali_ihsan.png" alt="Ali İhsan">
  </div>

  <div id="fade-layer"><div id="fade-text">(at arabası sesleri...)</div></div>

  <div id="about-overlay">
    <div id="about-box">
      <button id="about-close">×</button>
      <h2 style="margin-top:0;">Sislidere Köyü Davası</h2>
      <p>Bu metin yer tutucudur — renc2 buraya oyunun tanıtım/hakkında metnini yazacak.</p>
    </div>
  </div>

  <!-- Sesler -->
  <audio id="aud-mesaj" src="assets/giris/ses/mesaj.mp3" preload="auto"></audio>
  <audio id="aud-mors" src="assets/giris/ses/mors_kodu.mp3" preload="auto"></audio>
  <audio id="aud-halit" src="assets/karakterler/halit.mp3" preload="auto"></audio>
  <audio id="aud-polis" src="assets/karakterler/polis.mp3" preload="auto"></audio>

</div>

<script>
/* ==========================================================================
   SİSLİDERE DAVASI — GİRİŞ AKIŞI
   Bağımsız, tek dosyalık doğrusal sahne motoru.
   Ana oyunun case.json/engine.js motoruyla KARIŞTIRILMADI — çünkü bu akış
   oda/hotspot keşif mantığı değil, tek yönlü bir sahne+bulmaca zinciridir.
   Bitişte SORUSTURMA_HEDEFI değişkenindeki adrese yönlendirir.
   ========================================================================== */

const SORUSTURMA_HEDEFI = "oyun.html"; // Ana oyunun dedektif ofisi ekranına yönlendirir. Gerekirse değiştir.

// --- Kalibrasyon yardımcı: Alt tuşuyla tıklarsan konsola yüzdelik koordinat basar ---
document.addEventListener('click', (e) => {
  if (!e.altKey) return;
  const frame = document.getElementById('stage-frame').getBoundingClientRect();
  const x = ((e.clientX - frame.left) / frame.width * 100).toFixed(1);
  const y = ((e.clientY - frame.top) / frame.height * 100).toFixed(1);
  console.log(`Kalibrasyon -> left:${x}% top:${y}%`);
});
// 'c' tuşu: hotspot alanlarını kırmızı görünür yapar/kapatır
document.addEventListener('keydown', (e) => {
  if (e.key === 'c') document.body.classList.toggle('calibrate');
});

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------------- 1) ANA EKRAN ---------------- */
document.querySelectorAll('#scr-ana .hotspot').forEach(h=>{
  h.addEventListener('click', () => {
    const action = h.dataset.action;
    if (action === 'oyna'){
      showScreen('scr-ofis');
      // Sahneye girer girmez mesaj sesi (telgraf/haber sesi) çalar
      const a = document.getElementById('aud-mesaj');
      a.currentTime = 0; a.play().catch(()=>{});
      a.onended = () => document.getElementById('btn-mesaj-dinle').classList.add('show');
      // Ses yüklenemezse (dosya henüz eklenmediyse) yine de butonu 4sn sonra göster
      setTimeout(()=>document.getElementById('btn-mesaj-dinle').classList.add('show'), 4000);
    } else if (action === 'hakkinda'){
      document.getElementById('about-overlay').classList.add('show');
    } else if (action === 'cikis'){
      window.close();
      // Tarayıcı script ile açılmayan sekmeleri kapatmaya izin vermez; bu durumda kullanıcıyı bilgilendir
      setTimeout(()=>alert('Bu sekmeyi kapatabilirsiniz.'), 200);
    }
  });
});
document.getElementById('about-close').addEventListener('click', ()=>{
  document.getElementById('about-overlay').classList.remove('show');
});

/* ---------------- 2) OFİS / ŞEHİR ---------------- */
document.getElementById('btn-mesaj-dinle').addEventListener('click', () => {
  showScreen('scr-mors');
  const a = document.getElementById('aud-mors');
  a.currentTime = 0; a.play().catch(()=>{});
});

/* ---------------- 3) MORS KAĞIDI ---------------- */
function normalizeTR(str){
  return str
    .trim()
    .toLocaleLowerCase('tr-TR')
    .replace(/ı/g,'i').replace(/i̇/g,'i')
    .replace(/ş/g,'s')
    .replace(/ğ/g,'g')
    .replace(/ü/g,'u')
    .replace(/ö/g,'o')
    .replace(/ç/g,'c')
    .toUpperCase();
}
document.getElementById('btn-mors-tekrar').addEventListener('click', () => {
  const a = document.getElementById('aud-mors');
  a.currentTime = 0; a.play().catch(()=>{});
});
document.getElementById('btn-mors-ilerle').addEventListener('click', () => {
  const val = normalizeTR(document.getElementById('mors-input').value);
  const err = document.getElementById('mors-error');
  if (val === 'SISLIDERE'){
    err.classList.remove('show');
    showScreen('scr-raf');
  } else {
    err.classList.add('show');
    setTimeout(()=>err.classList.remove('show'), 2500);
  }
});
document.getElementById('mors-input').addEventListener('keydown', (e)=>{
  if (e.key === 'Enter') document.getElementById('btn-mors-ilerle').click();
});

/* ---------------- 4) RAF ---------------- */
document.getElementById('btn-dosya-incele').addEventListener('click', () => {
  showScreen('scr-dosya');
});

/* ---------------- 5) SİSLİDERE DOSYASI ---------------- */
document.getElementById('btn-incele').addEventListener('click', () => {
  document.getElementById('popup-overlay').classList.add('show');
});
document.getElementById('popup-close').addEventListener('click', () => {
  document.getElementById('popup-overlay').classList.remove('show');
  document.getElementById('btn-incele').classList.remove('show');
  document.getElementById('btn-git').classList.add('show');
});
document.getElementById('btn-git').addEventListener('click', () => {
  showScreen('scr-araba');
});

/* ---------------- 6) AT ARABASI ---------------- */
document.getElementById('btn-bin').addEventListener('click', () => {
  const fade = document.getElementById('fade-layer');
  const txt = document.getElementById('fade-text');
  fade.classList.add('show');
  setTimeout(()=>txt.classList.add('show'), 900);
  setTimeout(()=>{
    showScreen('scr-koy');
    txt.classList.remove('show');
  }, 3200);
  setTimeout(()=>{
    fade.classList.remove('show');
    // Sahneye girince Halit belirsin
    document.getElementById('char-halit').classList.add('show');
  }, 4200);
});

/* ---------------- 7) KÖY GİRİŞİ — HALİT DİYALOĞU ---------------- */
let halitShown = false;
document.getElementById('char-halit').addEventListener('click', () => {
  const sub = document.getElementById('sub-halit');
  const aud = document.getElementById('aud-halit');
  if (!halitShown){
    sub.textContent = "BURAYA HALİT'İN DİYALOG METNİ GELECEK"; // renc2 dolduracak
    sub.classList.add('show');
    aud.currentTime = 0; aud.play().catch(()=>{});
    halitShown = true;
  } else {
    sub.classList.remove('show');
    aud.pause();
    document.getElementById('char-halit').classList.remove('show');
    document.getElementById('btn-ofise-git').classList.add('show');
  }
});
document.getElementById('btn-ofise-git').addEventListener('click', () => {
  showScreen('scr-dedektif');
  document.getElementById('char-polis').classList.add('show');
});

/* ---------------- 8) DEDEKTİF OFİSİ — POLİS DİYALOĞU ---------------- */
let polisShown = false;
document.getElementById('char-polis').addEventListener('click', () => {
  const sub = document.getElementById('sub-polis');
  const aud = document.getElementById('aud-polis');
  if (!polisShown){
    sub.textContent = "BURAYA POLİSİN DİYALOG METNİ GELECEK"; // renc2 dolduracak
    sub.classList.add('show');
    aud.currentTime = 0; aud.play().catch(()=>{});
    polisShown = true;
  } else {
    sub.classList.remove('show');
    aud.pause();
    document.getElementById('char-polis').classList.remove('show');
    document.getElementById('btn-sorusturma').classList.add('show');
  }
});
document.getElementById('btn-sorusturma').addEventListener('click', () => {
  window.location.href = SORUSTURMA_HEDEFI;
});
</script>
</body>
</html>
