<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sislidere Davası</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

  <h1 id="caseTitle">Yükleniyor...</h1>

  <div class="stage-wrap">
    <div class="stage-frame" id="stageFrame">
      <div class="stage" id="stage"></div>

      <!-- Gün sayacı — oyun ekranının sağ üst köşesinde -->
      <div class="stage-day-tag" id="dayBadge">GÜN 1</div>

      <div class="corner-icons">
        <button class="corner-icon-btn" onclick="openMap()" title="Harita">
          <img src="assets/harita.png" alt="Harita">
        </button>
        <button class="corner-icon-btn" onclick="openNotebook()" title="Not Defteri">
          <img src="assets/defter.png" alt="Not Defteri">
        </button>
      </div>

      <!-- ============ HARİTA OVERLAY (artık oyun ekranının İÇİNDE) ============ -->
      <div class="map-overlay" id="mapOverlay">
        <button class="map-overlay-close" onclick="closeMap()">✕</button>
        <div class="map-scroll">
          <div class="map-box">
            <img id="mapImage" src="" alt="Harita">
            <div id="mapHotspots"></div>
          </div>
        </div>
      </div>

      <!-- ============ NOT DEFTERİ OVERLAY (artık oyun ekranının İÇİNDE) ============ -->
      <div class="notebook-overlay" id="notebookOverlay">
        <button class="notebook-overlay-close" onclick="closeNotebook()">✕</button>
        <div class="notebook-scroll">
        <div class="notebook-box">
          <div class="notebook-img-wrap">
            <img id="notebookImage" src="" alt="Not Defteri">
            <div class="notebook-img-fallback" id="notebookImgFallback" style="display:none;"></div>

            <!-- SOL SAYFA: 2 şüpheli satırı — fotoğraf+isim sabit, altları/yanları serbest -->
            <div class="nb-page sol">
              <div class="nb-suspect-row" id="nbRow0">
                <div class="nb-suspect-notes">
                  <textarea class="nb-yazi" id="nbYaziSolUst" oninput="notebookYaziKaydet('solUst', this.value)"></textarea>
                  <canvas class="nb-canvas pasif" id="nbCanvasSolUst"></canvas>
                </div>
                <div class="nb-suspect-overlay">
                  <img class="nb-suspect-photo" id="nbPhoto0" src="" alt="">
                  <div class="nb-suspect-name" id="nbName0"></div>
                </div>
              </div>
              <div class="nb-suspect-row" id="nbRow1">
                <div class="nb-suspect-notes">
                  <textarea class="nb-yazi" id="nbYaziSolAlt" oninput="notebookYaziKaydet('solAlt', this.value)"></textarea>
                  <canvas class="nb-canvas pasif" id="nbCanvasSolAlt"></canvas>
                </div>
                <div class="nb-suspect-overlay">
                  <img class="nb-suspect-photo" id="nbPhoto1" src="" alt="">
                  <div class="nb-suspect-name" id="nbName1"></div>
                </div>
              </div>
            </div>

            <!-- SAĞ SAYFA: tamamen serbest not alanı, değişmiyor -->
            <div class="nb-page sag">
              <textarea class="nb-yazi" id="nbYaziSag" oninput="notebookYaziKaydet('sag', this.value)" placeholder="buraya not al..."></textarea>
              <canvas class="nb-canvas pasif" id="nbCanvasSag"></canvas>
            </div>

            <!-- Defterin kenarlarından sayfa çevirme -->
            <button class="nb-edge-arrow nb-edge-left" id="nbEdgeGeri" onclick="notebookSayfaGeri()">‹</button>
            <button class="nb-edge-arrow nb-edge-right" id="nbEdgeIleri" onclick="notebookSayfaIleri()">›</button>
          </div>
          <div class="notebook-toolbar">
            <button class="nb-btn active" id="nbModYaz" onclick="notebookModAyarla(false)">✎ Yaz</button>
            <button class="nb-btn" id="nbModCiz" onclick="notebookModAyarla(true)">✏️ Çiz</button>
            <button class="nb-btn" onclick="notebookTemizle()">🗑 Temizle</button>
            <span class="nb-sayfa-gösterge" id="nbSayfaGöstergesi">Sayfa 1 / 5</span>
          </div>
        </div>
        </div>
      </div>

      <!-- ============ SORGU/İNCELEME/TV/KAYIT MODALI (artık oyun ekranının İÇİNDE) ============ -->
      <div class="modal-bg" id="modalBg">
        <div class="modal" id="modalBody"></div>
      </div>
    </div>
    <div class="inventory" id="inventory"><span class="inv-empty">envanter boş</span></div>
  </div>

  <button class="calib-toggle" id="calibToggle">🎯 Kalibrasyon Modu: Kapalı</button>
  <div class="calib-readout" id="calibReadout"></div>

  <div class="sleep-overlay" id="sleepOverlay">
    <div class="content">
      <div class="day-num" id="sleepDayNum">GÜN 2</div>
      <p id="sleepText">Yeni bir gün başlıyor.</p>
      <button onclick="wakeUp()">Uyan</button>
    </div>
  </div>

  <script src="engine.js?v=5"></script>
</body>
</html>
