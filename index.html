<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sislidere Köyü Davası</title>
<style>
  :root {
    --parchment: #e9dcc0;
    --parchment-dark: #3a2c1a;
    --ink: #241a0f;
    --accent: #8a5a2b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #0a0806;
    font-family: 'Georgia', 'Times New Roman', serif;
    overflow: hidden;
  }

  #stage-frame {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(100vw, calc(100vh * 16 / 9));
    height: min(100vh, calc(100vw * 9 / 16));
    /* dvh/dvw (dinamik viewport birimleri) mobilde tarayıcı çubuğu
       açılıp kapandıkça daha doğru boyut verir; desteklemeyen eski
       tarayıcılar bu satırı geçersiz sayıp yukarıdaki vw/vh'a döner. */
    width: min(100dvw, calc(100dvh * 16 / 9));
    height: min(100dvh, calc(100dvw * 9 / 16));
    aspect-ratio: 16 / 9;
    background: #000;
    overflow: hidden;
    box-shadow: 0 0 50px rgba(0,0,0,0.9);
  }

  .screen {
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.8s ease;
  }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
  }

  .hotspot {
    position: absolute;
    cursor: pointer;
    background: rgba(255, 255, 255, 0);
  }

  .btn {
    position: absolute;
    padding: 0.8em 1.8em;
    background: linear-gradient(180deg, #6b4423, #4a2f18);
    color: var(--parchment);
    border: 2px solid #2c1c0e;
    border-radius: 6px;
    font-family: inherit;
    font-size: clamp(13px, 1.5vw, 18px);
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #1c110a, 0 6px 12px rgba(0,0,0,0.6);
    transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.5s ease;
    opacity: 0;
    pointer-events: none;
    z-index: 10;
  }
  .btn.show {
    opacity: 1;
    pointer-events: auto;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 0 #1c110a, 0 10px 16px rgba(0,0,0,0.7);
  }

  /* Nabız gibi hafif büyüyüp küçülen ikonlar — büyüteç, ayak izi, el, kulak
     ORTAK kullanır. ÖNEMLİ: left/top artık ikonun SOL-ÜST köşesi değil,
     TAM ORTASI. Yani "bu ikonu tam şu noktaya otursun" dediğin nokta neyse
     left/top'a direkt onu yaz, genişlik yarısı falan hesaplamana gerek yok. */
  .nabiz-ikon {
    position: absolute;
    cursor: pointer;
    filter: drop-shadow(0 3px 8px rgba(0,0,0,.6));
    animation: ikonNabiz 1.6s ease-in-out infinite;
    z-index: 6;
    transform: translate(-50%, -50%);
    transition: opacity .5s ease;
  }
  .gizli { opacity: 0; pointer-events: none; }
  @keyframes ikonNabiz {
    0%,100% { transform: translate(-50%, -50%) scale(1); }
    50% { transform: translate(-50%, -50%) scale(1.12); }
  }

  /* Mors mesajı yazı alanı — hafif döndürülmüş (sağ üst yukarı bakıyor)
     ve az sağa kaydırılmış, fotoğraftaki eğime uysun diye */
  .mors-yazi-alani {
    position: absolute;
    left: 59%; top: 80%; width: 23%;
    transform: rotate(-5deg);
    z-index: 15;
  }
  .mors-yazi-alani input {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--ink);
    font-family: inherit;
    font-size: clamp(14px, 1.8vw, 20px);
    color: var(--ink);
    padding: 0.3em 0.2em;
    text-transform: uppercase;
    outline: none;
    transition: color 0.2s ease, border-color 0.2s ease;
  }
  .mors-yazi-alani input.hata {
    border-bottom-color: #c0392b;
    color: #c0392b;
  }

  .character {
    position: absolute;
    right: 5%; bottom: -15%;
    height: 85%;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.5s ease;
    z-index: 5;
  }
  .character.show {
    opacity: 1;
    pointer-events: auto;
    animation: karakterNabiz 1.8s ease-in-out infinite;
  }
  .character.talking {
    animation: none; /* konuşma başlayınca düzgün durur, nabız atmayı bırakır */
  }
  @keyframes karakterNabiz {
    0%,100% { filter: drop-shadow(0 6px 14px rgba(0,0,0,.5)); }
    50% { filter: drop-shadow(0 6px 18px rgba(227,169,74,.55)); }
  }

  .subtitle {
    position: absolute;
    left: 5%; right: 32%; bottom: 6%;
    background: rgba(20, 14, 8, 0.9);
    color: var(--parchment);
    padding: 1.2em 1.5em;
    border-radius: 8px;
    border-left: 5px solid var(--accent);
    font-size: clamp(13px, 1.5vw, 18px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
    z-index: 10;
  }
  .subtitle.show { opacity: 1; pointer-events: auto; }

  #popup-overlay {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.8);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.35s ease;
    z-index: 50;
  }
  #popup-overlay.show { opacity: 1; pointer-events: auto; }
  #popup-overlay img {
    max-width: 65%; max-height: 75%;
    border: 6px solid var(--parchment);
    border-radius: 4px;
  }
  #popup-close {
    position: absolute; top: 8%; right: 12%;
    width: 2.5em; height: 2.5em; border-radius: 50%;
    background: var(--parchment-dark); color: var(--parchment);
    border: 2px solid var(--parchment);
    font-size: 20px; font-weight: bold; cursor: pointer;
  }

  #fade-layer {
    position: absolute; inset: 0;
    background: #000; opacity: 0; pointer-events: none;
    transition: opacity 1.5s ease;
    display: flex; align-items: center; justify-content: center;
    z-index: 60;
  }
  #fade-layer.show { opacity: 1; pointer-events: auto; }
  #fade-text {
    color: var(--parchment);
    font-style: italic;
    font-size: clamp(18px, 2.5vw, 30px);
    opacity: 0; transition: opacity 0.8s ease;
  }
  #fade-text.show { opacity: 1; }

  /* Tam ekran düğmesi — mobilde tarayıcı çubuğunu gizleyip oyunun tüm
     ekranı kaplamasını sağlar. stage-frame'in İÇİNDE, tüm ekranlarda sabit. */
  .tam-ekran-btn{
    position:absolute;top:10px;right:10px;z-index:999;
    width:34px;height:34px;border-radius:6px;
    background:rgba(28,29,24,.75);border:1px solid var(--accent);
    color:var(--parchment);font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    opacity:.55;transition:opacity .2s ease;
  }
  .tam-ekran-btn:hover{opacity:1;}

  /* Telefon dikey tutulsa bile oyunu her zaman yatay göster.
     ÖNEMLİ: bu blok dosyanın EN SONUNDA olmak zorunda — vw/vh yer
     değiştirmesi (aşağıda) ve #stage-frame üzerindeki geçersiz kılma,
     yukarıdaki normal kurallardan SONRA gelmezse hiç etkili olmaz
     (CSS'te eşit özgüllükte son gelen kural kazanır). */
  @media screen and (orientation: portrait) {
    html {
      transform: rotate(-90deg);
      transform-origin: left top;
      width: 100vh;
      height: 100vw;
      overflow-x: hidden;
      position: absolute;
      top: 100%;
      left: 0;
    }
    body {
      width: 100vh;
      height: 100vw;
    }
    /* vw/vh döndürülmüş ekranda "mantıken" yer değiştirir: fiziksel
       yükseklik artık yatay genişlik gibi davranır, bu yüzden formülde
       vw ve vh birbirinin yerine geçiyor. */
    #stage-frame {
      width: min(100vh, calc(100vw * 16 / 9));
      height: min(100vw, calc(100vh * 9 / 16));
    }
    /* dvh/dvw ile aynı mantık, mobil tarayıcı çubuğu değişimlerine karşı
       daha doğru — desteklemeyen tarayıcılarda bu satırlar geçersiz sayılıp
       yukarıdaki vw/vh sürümüne geri düşülür. */
    html { width: 100dvh; height: 100dvw; }
    body { width: 100dvh; height: 100dvw; }
    #stage-frame {
      width: min(100dvh, calc(100dvw * 16 / 9));
      height: min(100dvw, calc(100dvh * 9 / 16));
    }
  }
</style>
</head>
<body>

<div id="stage-frame">

  <button class="tam-ekran-btn" id="tamEkranBtn" title="Tam Ekran">⛶</button>

  <!-- 1. ANA EKRAN -->
  <div class="screen active" id="scr-ana" style="background-image:url('assets/ana_ekran.jpg')">
    <div class="hotspot" id="btn-oyna" style="left:4%;top:33%;width:19%;height:9%;"></div>
    <div class="hotspot" id="btn-hakkinda" style="left:4%;top:43%;width:19%;height:9%;"></div>
    <div class="hotspot" id="btn-cikis" style="left:4%;top:53%;width:19%;height:9%;"></div>
  </div>

  <!-- 2. OFİS / ŞEHİR — ekrana gelince 2 sn sonra mesaj.mp3 otomatik çalar,
       aynı anda telgrafın üstünde nabız atan el.png belirir; ona tıklayınca
       ses kesilir ve mors ekranına geçilir -->
  <div class="screen" id="scr-ofis" style="background-image:url('assets/ofis_sehir.jpg')">
    <img class="nabiz-ikon gec-bekle gizli" id="btn-telgraf" src="assets/el.png" alt="Telgrafa Bas" style="left:25.4%;top:82.6%;width:8%;">
  </div>

  <!-- 3. MORS KAĞIDI — telgrafın altında kulak.png ikonu mesajı tekrar dinletir -->
  <div class="screen" id="scr-mors" style="background-image:url('assets/mors_kagidi.jpg')">
    <img class="nabiz-ikon gec-bekle gizli" id="btn-mors-tekrar" src="assets/kulak.png" alt="Mesajı Dinle" style="left:17.7%;top:59.2%;width:8%;">

    <div class="mors-yazi-alani">
      <input type="text" id="mors-input" placeholder="..." maxlength="30" autocomplete="off">
    </div>
    <button class="btn show" id="btn-mors-ilerle" style="left:82.0%;top:76.0%;">İlerle</button>
  </div>

  <!-- 4. RAF — dosyanın üstünde nabız atan el.png -->
  <div class="screen" id="scr-raf" style="background-image:url('assets/raf.jpg')">
    <img class="nabiz-ikon gec-bekle gizli" id="btn-dosya-incele" src="assets/el.png" alt="İncele" style="left:64.4%;top:47.4%;width:8%;">
  </div>

  <!-- 5. SİSLİDERE DOSYASI — büyüteç ikonuna tıklayınca Ali İhsan popup açılır,
       kapatınca büyüteç kaybolur ve 2 sn sonra ekranın SOLUNDAKİ kapının
       üstünde ayak izi belirir -->
  <div class="screen" id="scr-dosya" style="background-image:url('assets/sislidere_dosya.jpg')">
    <img class="nabiz-ikon gec-bekle gizli" id="btn-dosya-incele-ic" src="assets/buyutec.png" alt="İncele" style="left:55%;top:45%;width:8%;">
    <img class="nabiz-ikon gizli" id="btn-dosya-git" src="assets/ayak.png" alt="Git" style="left:4%;top:30%;width:6%;">
  </div>

  <!-- 6. AT ARABASI — ayak izi tam kapının önünde -->
  <div class="screen" id="scr-araba" style="background-image:url('assets/at_arabasi.jpg')">
    <img class="nabiz-ikon gec-bekle gizli" id="btn-bin" src="assets/ayak.png" alt="Bin" style="left:58.9%;top:73.7%;width:5%;">
  </div>

  <!-- 7. KÖY GİRİŞİ — Halit (muhtar) ile konuşma bitince 2 sn sonra ayak izi belirir -->
  <div class="screen" id="scr-koy" style="background-image:url('assets/koy_giris.jpg')">
    <img class="character" id="char-halit" src="assets/karakterler/halit.png" alt="Halit">
    <div class="subtitle" id="sub-halit"></div>
    <img class="nabiz-ikon gizli" id="btn-ofise-git" src="assets/ayak.png" alt="Ofise Git" style="left:49.5%;top:62.8%;width:5%;">
  </div>

  <!-- 8. DEDEKTİF OFİSİ -->
  <div class="screen" id="scr-dedektif" style="background-image:url('assets/dedektif_ofis.jpg')">
    <img class="character" id="char-polis" src="assets/karakterler/polis.png" alt="Polis">
    <div class="subtitle" id="sub-polis"></div>
  </div>

  <!-- KATMANLAR VE SESLER -->
  <div id="popup-overlay">
    <button id="popup-close">×</button>
    <img src="assets/ali_ihsan.png" alt="Ali İhsan">
  </div>

  <div id="fade-layer">
    <div id="fade-text">(at arabası sesleri...)</div>
  </div>

  <audio id="aud-mesaj" src="assets/ses/mesaj.mp3" preload="auto"></audio>
  <audio id="aud-mors" src="assets/ses/mors_kodu.mp3" preload="auto"></audio>

</div>

<script>
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const scr = document.getElementById(id);
  scr.classList.add('active');
  // O ekrana özel, "ekran açılır açılmaz değil, 2 sn sonra belirsin" işaretli
  // ikonlar (gec-bekle) — dosya-git/ofise-git gibi belirli bir oyun olayına
  // bağlı ikonlar bu sınıfı taşımıyor, onlar kendi tetikleyicisinde gecikir.
  scr.querySelectorAll('.nabiz-ikon.gec-bekle.gizli').forEach(el => {
    setTimeout(() => el.classList.remove('gizli'), 2000);
  });
}

/* 1. ANA EKRAN */
document.getElementById('btn-oyna').addEventListener('click', () => {
  showScreen('scr-ofis');
  // Ofis ekranına gelince 2 saniye sonra mesaj kendiliğinden çalmaya başlar
  setTimeout(() => {
    const aud = document.getElementById('aud-mesaj');
    aud.currentTime = 0;
    aud.play().catch(() => {});
  }, 2000);
});

/* 2. OFİS — telgrafın üstündeki el.png'ye tıklayınca mesaj sesi kesilir,
   mors ekranına geçilir */
document.getElementById('btn-telgraf').addEventListener('click', () => {
  const aud = document.getElementById('aud-mesaj');
  aud.pause();
  aud.currentTime = 0;
  showScreen('scr-mors');
});

/* 3. MORS */
function normalizeTR(str) {
  return str.trim().toLocaleLowerCase('tr-TR')
    .replace(/ı/g,'i').replace(/ş/g,'s').replace(/ğ/g,'g')
    .replace(/ü/g,'u').replace(/ö/g,'o').replace(/ç/g,'c').toUpperCase();
}

document.getElementById('btn-mors-tekrar').addEventListener('click', () => {
  const aud = document.getElementById('aud-mors');
  aud.currentTime = 0;
  aud.play().catch(() => {});
});

document.getElementById('btn-mors-ilerle').addEventListener('click', () => {
  const inputEl = document.getElementById('mors-input');
  const inputVal = normalizeTR(inputEl.value);
  if (inputVal === 'SISLIDERE') {
    inputEl.classList.remove('hata');
    showScreen('scr-raf');
  } else {
    inputEl.classList.add('hata');
  }
});

/* 4. RAF & 5. DOSYA */
document.getElementById('btn-dosya-incele').addEventListener('click', () => showScreen('scr-dosya'));

document.getElementById('btn-dosya-incele-ic').addEventListener('click', () => {
  document.getElementById('popup-overlay').classList.add('show');
});
document.getElementById('popup-close').addEventListener('click', () => {
  document.getElementById('popup-overlay').classList.remove('show');
  document.getElementById('btn-dosya-incele-ic').classList.add('gizli');
  setTimeout(() => {
    document.getElementById('btn-dosya-git').classList.remove('gizli');
  }, 2000);
});
document.getElementById('btn-dosya-git').addEventListener('click', () => showScreen('scr-araba'));

/* 6. AT ARABASI */
document.getElementById('btn-bin').addEventListener('click', () => {
  const fadeLayer = document.getElementById('fade-layer');
  const fadeText = document.getElementById('fade-text');
  fadeLayer.classList.add('show');
  setTimeout(() => fadeText.classList.add('show'), 800);
  setTimeout(() => { showScreen('scr-koy'); fadeText.classList.remove('show'); }, 3000);
  setTimeout(() => { fadeLayer.classList.remove('show'); document.getElementById('char-halit').classList.add('show'); }, 4200);
});

/* 7. KÖY GİRİŞİ */
let halitState = 0;
document.getElementById('char-halit').addEventListener('click', () => {
  const sub = document.getElementById('sub-halit');
  const char = document.getElementById('char-halit');
  if (halitState === 0) {
    sub.textContent = "Hoş geldiniz dedektif! Sisledere Köyü'ne varışınız tam zamanında oldu.";
    sub.classList.add('show');
    char.classList.add('talking'); // konuşurken nabız durur, düzgün durur
    halitState = 1;
  } else {
    sub.classList.remove('show');
    document.getElementById('char-halit').classList.remove('show');
    setTimeout(() => {
      document.getElementById('btn-ofise-git').classList.remove('gizli');
    }, 2000);
    halitState = 0;
  }
});

document.getElementById('btn-ofise-git').addEventListener('click', () => {
  showScreen('scr-dedektif');
  document.getElementById('char-polis').classList.add('show');
});

/* 8. POLİS VE ANA OYUNA GEÇİŞ */
let polisState = 0;
document.getElementById('char-polis').addEventListener('click', () => {
  const sub = document.getElementById('sub-polis');
  const char = document.getElementById('char-polis');
  if (polisState === 0) {
    sub.textContent = "Başkomiserim, durum dosyasını masaya bıraktım. Soruşturmaya başlayabilirsiniz.";
    sub.classList.add('show');
    char.classList.add('talking'); // konuşurken nabız durur, düzgün durur
    polisState = 1;
  } else {
    sub.classList.remove('show');
    document.getElementById('char-polis').classList.remove('show');
    setTimeout(() => { window.location.href = "oyun.html"; }, 500);
  }
});

/* Tam ekran düğmesi — mobil tarayıcı arayüzünü (adres çubuğu, sekmeler)
   gizler, oyun gerçekten tüm ekranı kaplar. Tarayıcı güvenlik kısıtı
   gereği sadece bir tıklama sonrası çalışabilir, sayfa açılışında otomatik
   tetiklenemez. */
document.getElementById('tamEkranBtn').addEventListener('click', () => {
  const el = document.documentElement;
  if (!document.fullscreenElement) {
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(() => {});
  } else {
    const exit = document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen;
    if (exit) exit.call(document).catch(() => {});
  }
});
</script>
</body>
</html>
